[package]
name = "octopus_gpui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
better_default = { workspace = true }
bytemuck.workspace = true
chumsky.workspace = true
convert_case.workspace = true
cpal = { workspace = true, features = ["jack", "pipewire", "pulseaudio"] }
crossbeam = { workspace = true }
dasp = {
  workspace = true,
  features = [
    "interpolate",
    "interpolate-linear",
    "interpolate-sinc",
    "ring_buffer",
    "signal",
  ]
}
dasp_sample = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
dioxus-devtools.workspace = true
docstr.workspace = true
etcetera = { workspace = true }
flume.workspace = true
octopus_common = { workspace = true }
octopus_core = { workspace = true }
gilrs = { workspace = true, features = ["serde-serialize"] }
gpui = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_elements.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "wgpu", "x11"] }
# gpui-component = { workspace = true }
# gpui-component-assets.workspace = true
image.workspace = true
image24 = { package = "image", version = "0.24.9" }
include_dir = { workspace = true, features = ["glob"] }
indexmap = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
jiff.workspace = true
light-file-dialog.workspace = true
num-traits.workspace = true
palette = { workspace = true, features = ["named"] }
parking_lot = { workspace = true }
png.workspace = true
png-achunk.workspace = true
rayon.workspace = true
rfd = { workspace = true }
ringbuf = { workspace = true }
rust-embed = { workspace = true, features = ["compression", "include-exclude", "interpolate-folder-path"] }
schemars.workspace = true
seq-macro.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
slotmap.workspace = true
smallvec = { workspace = true, features = ["serde"] }
spin_sleep = { workspace = true }
spire_enum.workspace = true
strum = { workspace = true, features = ["derive"] }
subsecond.workspace = true
tap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-flame = { workspace = true }
tracing-log = { workspace = true }
tracing-samply = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
uzi = { workspace = true }
wgpu = "29.0.3"

[build-dependencies]
databake = { workspace = true }
octopus_common = { workspace = true }
glob.workspace = true
serde = { workspace = true }
vergen-gix = { workspace = true }
yaml_serde.workspace = true

[features]
default = ["tracing/release_max_level_off"]
no-tracing = ["tracing/max_level_off"]
