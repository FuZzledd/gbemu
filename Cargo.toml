[workspace]
resolver = "3"
members = ["octopus_common", "octopus_core", "octopus_gpui"]
exclude = ["octopus_dioxus", "octopus_iced", "octopus_slint", "octopus_slint/slint"]
default-members = ["octopus_common", "octopus_core", "octopus_gpui"]

[workspace.package]
edition = "2024"
license = "MIT or Apache-2.0 or MPL-2.0 or EUPL-1.2"

[workspace.dependencies]
anyhow = "1.0.102"
array-deque = "0.4.0"
base64 = "0.22.1"
better_default = "1.0.5"
bitvec = "1.0.1"
blip_buf = "0.2.1"
bytemuck = "1.25.0"
bytes = "1.12.0"
capture-it = "0.4.3"
chapa = "0.9.0"
chumsky = "0.13.0"
convert_case = "0.11.0"
cpal = "0.18.0"
crossbeam = "0.8.4"
dasp = "0.11.0"
dasp_sample = "0.11.0"
databake = { version = "0.2.1" }
datatest-stable = "0.3.3"
derive_more = { version = "2.1.1" }
dioxus-devtools = "0.7.9"
docstr = "0.4.10"
etcetera = "0.11.0"
flume = { version = "0.12.0" }
gilrs = { version = "0.11.2" }
glob = "0.3.3"
gpui = { package = "gpui-ce", git = "https://github.com/FuZzledd/gpui-ce", version = "*" }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/FuZzledd/gpui-ce", version = "*" }
gpui_platform = {
  package = "gpui_ce_platform",
  git = "https://github.com/FuZzledd/gpui-ce",
  version = "*",
}
image = "0.25.6"
include_dir = "0.7.4"  # slint = {#   git = "https://github.com/slint-ui/slint",#   branch = "pre-release/1.17"# }# slint-build = {#   git = "https://github.com/slint-ui/slint",#   branch = "pre-release/1.17"# }
indexmap = "2.14.0"
iterm2img = "0.1.0"
itertools = "0.15.0"
jiff = "0.2.35"
light-file-dialog = "3.21.3"
log = "0.4.32"
nom = "8.0.0"
num-traits = "0.2.19"
octopus_common = { path = "octopus_common" }
octopus_core = { path = "octopus_core" }
palette = "0.7.6"
parking_lot = "0.12.5"
paste = "1.0.15"
png = "0.18.1"
png-achunk = "0.1.0"
rayon = { version = "1.12.0" }
rfd = "0.17.2"
rgb = "0.8.53"
ringbuf = "0.5.0"
rust-embed = { version = "8.12.0", features = ["compression", "include-exclude", "interpolate-folder-path"] }
schemars = "1.2.1"
seq-macro = { version = "0.3.6" }
serde = "1.0.228"
serde_json = "1.0.150"
slotmap = "1.1.1"
smallvec = { version = "1.15.2", features = ["serde"] }
spin_sleep = "1.3.3"
spire_enum = "1.0.0"
strum = "0.28.0"
subsecond = "0.7.9"
tap = "1.0.1"
thiserror = "2.0.18"
time = "0.3.51"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-flame = "0.2.0"
tracing-log = "0.2.0"
tracing-samply = "0.1.5"
tracing-subscriber = "0.3.23"
unarc-rs = "0.6.1"
uzi = { version = "0.2.1" }
vergen-gix = { version = "10.0.2", features = ["build", "cargo", "rustc", "si"] }
yaml_serde = "0.10.4"

[workspace.metadata]

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.octopus_core]
opt-level = 3

[profile.release]
strip = "symbols"
lto = true
panic = "abort"
